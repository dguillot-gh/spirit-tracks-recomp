plugins {
    id 'com.android.application'
}

// The game's C comes from a PC build (2-BUILD.ps1: build/release/recomp_generated); SDL's source from the same build.
def repo = projectDir.parentFile.parentFile
def slashes = { String p -> p.replace('\\', '/') }  // (CMake reads backslashes as escapes)
def generated = slashes(project.findProperty('stGeneratedDir') ?: new File(repo, 'build/release/recomp_generated').path)
def sdlSource = slashes(project.findProperty('stSdlSource') ?: new File(repo, 'build/release/_deps/sdl3-src').path)
// The CMake that local.properties' cmake.dir points at (5-BUILD-ANDROID.ps1 passes its version): the project needs 3.28+.
def cmakeVersion = project.findProperty('stCmakeVersion') ?: '3.31.6'
def ninja = project.findProperty('stNinja')
// The ROM the game's C was recompiled from (5-BUILD-ANDROID.ps1 passes it): the launcher takes only that ROM.
def romSha1 = project.findProperty('stRomSha1') ?: ''
def romVariant = project.findProperty('stRomVariant') ?: 'USA'
// Release builds (CI): one fixed key, so each new APK installs over the last one and keeps the player's saves.
// -PstKeystore=<file> -PstKeystorePassword -PstKeyAlias -PstKeyPassword; without them, the usual debug key.
def keystore = project.findProperty('stKeystore')
// -PstVersionCode (must grow with every release: CI passes minutes since 2026), -PstVersionName (the tag),
// -PstUpdateRepo (owner/name: the launcher checks that repo's GitHub Releases for a newer APK; empty: no check).
def versionCodeProp = (project.findProperty('stVersionCode') ?: '1') as int
def versionNameProp = project.findProperty('stVersionName') ?: '0.1.0'
def updateRepo = project.findProperty('stUpdateRepo') ?: ''

android {
    namespace = "com.strecomp.st"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.strecomp.st"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode versionCodeProp
        versionName versionNameProp
        buildConfigField "String", "UPDATE_REPO", "\"${updateRepo}\""
        buildConfigField "String", "ROM_SHA1", "\"${romSha1}\""
        buildConfigField "String", "ROM_VARIANT", "\"${romVariant}\""
        // A shell APK (-PstShell) has no game inside: the launcher asks for the game module (libst_game.so).
        buildConfigField "boolean", "SHELL", project.hasProperty('stShell') ? "true" : "false"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-26",
                        "-DFFCC_BUILD_TESTS=OFF", "-DST_GENERATED_DIR=${generated}",
                        "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlSource}", "-DFETCHCONTENT_FULLY_DISCONNECTED=ON"
                if (ninja) arguments "-DCMAKE_MAKE_PROGRAM=${slashes(ninja)}"
                abiFilters 'arm64-v8a'
                if (project.hasProperty('stShell')) {
                    arguments "-DST_SHELL=ON"
                    targets 'main', 'stbuild'
                } else {
                    targets 'main', 'st_game'
                }
            }
        }
    }
    if (keystore) {
        signingConfigs {
            stRelease {
                storeFile file(keystore)
                storePassword project.findProperty('stKeystorePassword')
                keyAlias project.findProperty('stKeyAlias')
                keyPassword project.findProperty('stKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            if (keystore) signingConfig signingConfigs.stRelease
            // The game and the engine are always optimised (CMake), so the debug APK plays at full speed.
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
        }
        release {
            minifyEnabled false
        }
    }
    // -PstShell: a shell APK, without the recompiled game (libst_game.so, still built): the game is copied to the app's
    // files (game/libst_game.so, beside rom/) and loaded from there. See scripts/README.md.
    // The shell APK's builder assets (GameBuilder.java unpacks them): TinyCC's headers, the runtime header the game's C
    // includes, and the game's recompiler config (functions/hooks/regions: no game data).
    if (project.hasProperty('stShell')) {
        sourceSets { main { assets.srcDirs += layout.buildDirectory.dir('stbuild-assets') } }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version cmakeVersion
        }
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError = false
    }
}

// The shell APK's builder assets, under build/stbuild-assets/stbuild/{tcc,rt,config}.
tasks.register('stBuildAssets', Copy) {
    def out = layout.buildDirectory.dir('stbuild-assets/stbuild')
    into out
    from(new File(repo, 'third_party/tinycc/include')) { into 'tcc/include' }
    from(new File(repo, 'tools/ondevice')) { include '*.h'; into 'tcc/include' }
    from(new File(repo, 'runtime/include')) { into 'rt' }
    from(new File(repo, 'frontend/config/bkie')) { into 'config' }
}
if (project.hasProperty('stShell')) preBuild.dependsOn 'stBuildAssets'
